<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Equipment Database</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="page-header">
    <div class="header-inner">
      <h1>Creative Technologies Equipment</h1>
      <p class="subtitle">Search the department's equipment store by name or category</p>
    </div>
  </header>

  <main class="page-main">
    <div class="controls">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input
          id="search-input"
          type="text"
          placeholder="Search by name or category, e.g. &quot;microphone&quot; or &quot;Cameras&quot;"
          autocomplete="off"
          aria-label="Search equipment"
        />
        <button id="clear-search" class="clear-btn" type="button" aria-label="Clear search" hidden>&times;</button>
      </div>

      <div id="category-chips" class="category-chips" role="group" aria-label="Filter by category">
        <!-- populated by app.js -->
      </div>
    </div>

    <p id="result-count" class="result-count"></p>

    <div id="results" class="results-grid"></div>

    <p id="empty-state" class="empty-state" hidden>No equipment matches your search.</p>
  </main>

  <footer class="page-footer">
    <p>Data last built from spreadsheet &mdash; see README for how to update.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
